name: smoke-and-uptime
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for deploy on push
        if: github.event_name == 'push'
        run: sleep 240
      - run: node scripts/smoke-test.mjs
